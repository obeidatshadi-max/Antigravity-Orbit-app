[build]
  command = "node scripts/build.mjs"
  publish = "public"
  functions = "netlify/functions"

# Block source routes as well as keeping them outside the publish directory.
[[redirects]]
  from = "/antigravity-schema.sql"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
